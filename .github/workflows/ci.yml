name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (courses + app boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # main.py runs create_all and Postgres-only ALTERs at import time, so the
    # smoke test needs a real Postgres rather than SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # httpx is only needed by FastAPI's TestClient for the smoke test below.
      - run: pip install -r requirements.txt httpx

      - name: Validate course JSON
        run: python scripts/validate_courses.py

      - name: Byte-compile
        run: python -m compileall -q app scripts create_admin.py create_test_account.py

      - name: Boot app and hit /
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          r = client.get("/")
          assert r.status_code == 200, r.text
          # Course content must stay behind sign-in.
          r = client.get("/api/courses")
          assert r.status_code in (401, 403), f"/api/courses is public: {r.status_code}"
          print("ok")
          EOF
